# Deploy tự động lên Production (server vật lý tự host, xem deploy/README.md)
# khi push vào `production` — `production` là nhánh auto-deploy production
# (đổi từ `main` trước đây, xem CONTRIBUTING.md mục 1 — cập nhật 2026-08-26).
# Dùng GitHub Environment "production" với required reviewer để có bước
# duyệt thủ công trước khi deploy thật (Settings → Environments → production).
#
# LƯU Ý (2026-08-27): job `deploy` chạy trên SELF-HOSTED RUNNER cài ngay
# trên server vật lý (không phải GHCR-hosted `ubuntu-latest`) — xem comment
# chi tiết ở cd-staging.yml (lý do: server không có static IP public, GitHub
# Actions cloud không SSH vào IP LAN được). Không cần
# DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY/DEPLOY_SSH_PORT nữa.
name: CD - Production

on:
  push:
    branches: [production]
    paths:
      - "pps-education-backend/**"
      # Them 2026-09-24: PR chi doi file compose (VD ghim image MinIO #553) truoc day KHONG kich hoat CD
      # -> buoc "Dong bo docker-compose.yml" khong chay, file tren server lech repo. Luu y: CD van chi
      # pull/up service backend - doi image service khac (minio...) van phai lam tay tren server.
      - "deploy/docker-compose.production.yml"
  workflow_dispatch: {} # cho phép bấm "Run workflow" tay trên GitHub, không cần commit mới (VD verify runner/redeploy thủ công)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag (short SHA làm version tạm — đổi sang git tag semver khi release chính thức)
        id: meta
        run: |
          VERSION=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}/backend:prod-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./pps-education-backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository }}/backend:prod-latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, pps-education]
    environment: production # yêu cầu approval thủ công nếu đã cấu hình required reviewer
    steps:
      - uses: actions/checkout@v4

      # Bổ sung 2026-09-15 (đã xác nhận với người dùng, cùng gốc sự cố với cd-staging.yml) - job này
      # trước đây chỉ pull image + restart container, KHÔNG BAO GIỜ đồng bộ lại docker-compose.yml trên
      # server - phát hiện qua sự cố thật: DB_POOL_SIZE thêm vào deploy/docker-compose.production.yml
      # không bao giờ tới được server dù CI xanh, khiến pool DB production luôn fallback mặc định cứng
      # 10 connection. File repo chỉ chứa placeholder ${VAR} (secret thật nằm ở
      # /opt/pps-education/production/.env, KHÔNG đi qua bước này) nên copy đè an toàn.
      - name: Dong bo docker-compose.yml tu repo len server
        run: cp deploy/docker-compose.production.yml /opt/pps-education/production/docker-compose.yml

      - name: Pull prod-latest + restart container (chạy trực tiếp trên server)
        run: |
          cd /opt/pps-education/production
          docker compose pull backend
          docker compose up -d --no-deps backend
          docker image prune -f
