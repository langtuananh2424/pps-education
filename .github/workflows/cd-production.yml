# Deploy tự động lên Production (server vật lý tự host, xem deploy/README.md)
# khi push vào `production` — `production` là nhánh auto-deploy production
# (đổi từ `main` trước đây, xem CONTRIBUTING.md mục 1 — cập nhật 2026-08-26).
# Dùng GitHub Environment "production" với required reviewer để có bước
# duyệt thủ công trước khi deploy thật (Settings → Environments → production).
# Cần secret: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_SSH_PORT — thông
# tin SSH vào server (chung với environment staging hoặc tách riêng tùy nhu
# cầu — server vật lý là 1 máy duy nhất cho cả 2 stack, xem deploy/README.md).
name: CD - Production

on:
  push:
    branches: [production]
    paths:
      - "pps-education-backend/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag (short SHA làm version tạm — đổi sang git tag semver khi release chính thức)
        id: meta
        run: |
          VERSION=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}/backend:prod-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./pps-education-backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository }}/backend:prod-latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production # yêu cầu approval thủ công nếu đã cấu hình required reviewer
    steps:
      - name: Deploy backend over SSH (pull prod-latest + restart container)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script: |
            cd /opt/pps-education/production
            docker compose pull backend
            docker compose up -d --no-deps backend
            docker image prune -f
