# Deploy tự động lên môi trường Staging (server vật lý tự host, xem
# deploy/README.md) khi push vào `main` — `main` là nhánh auto-deploy staging
# (đổi từ `develop` trước đây, xem CONTRIBUTING.md mục 1 — cập nhật 2026-08-26).
#
# LƯU Ý (2026-08-27): job `deploy` chạy trên SELF-HOSTED RUNNER cài ngay
# trên server vật lý (không phải GHCR-hosted `ubuntu-latest`) — server không
# có static IP public nên GitHub Actions cloud KHÔNG THỂ SSH vào IP LAN
# (192.168.x.x) được. Runner tự kết nối OUTBOUND ra GitHub (không cần mở
# port/SSH qua internet), job chạy thẳng trên server nên không cần
# DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY/DEPLOY_SSH_PORT nữa. AN TOÀN với
# repo public vì job này chỉ trigger qua `push` vào nhánh `main` đã bật
# branch protection (chỉ chạy sau khi 1 PR được merge bởi người có quyền,
# KHÔNG BAO GIỜ trigger trực tiếp từ `pull_request` của fork lạ — xem
# deploy/README.md mục 8 để biết cách cài runner).
name: CD - Staging

on:
  push:
    branches: [main]
    paths:
      - "pps-education-backend/**"
  workflow_dispatch: {} # cho phép bấm "Run workflow" tay trên GitHub, không cần commit mới (VD verify runner/redeploy thủ công)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "image=ghcr.io/${{ github.repository }}/backend:staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./pps-education-backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository }}/backend:staging-latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, pps-education]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # Bổ sung 2026-09-15 (đã xác nhận với người dùng) - PHÁT HIỆN QUA SỰ CỐ THẬT: trước đây job này
      # chỉ pull image + restart container, KHÔNG BAO GIỜ đồng bộ lại nội dung docker-compose.yml trên
      # server - file đó chỉ được copy tay 1 lần lúc bootstrap (xem deploy/README.md), nên mọi thay đổi
      # sau này trong deploy/docker-compose.staging.yml (VD tăng DB_POOL_SIZE) IM LẶNG không bao giờ tới
      # được server dù CI/CD chạy xanh - khiến staging chấm điểm/chịu tải sai lệch hoàn toàn so với repo
      # mà không ai biết. File repo CHỈ chứa placeholder ${VAR} (không có secret thật - secret nằm ở
      # /opt/pps-education/staging/.env, KHÔNG đi qua bước này) nên copy đè an toàn.
      - name: Dong bo docker-compose.yml tu repo len server
        run: cp deploy/docker-compose.staging.yml /opt/pps-education/staging/docker-compose.yml

      - name: Pull staging-latest + restart container (chạy trực tiếp trên server)
        run: |
          cd /opt/pps-education/staging
          docker compose pull backend
          docker compose up -d --no-deps backend
          docker image prune -f
