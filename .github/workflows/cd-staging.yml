# Deploy tự động lên môi trường Staging (Railway) khi merge vào `develop`.
# Cần thiết lập trước 2 secret trong GitHub repo settings:
#   RAILWAY_TOKEN       — token của project Railway (staging)
#   RAILWAY_PROJECT_ID  — id project Railway (staging)
name: CD - Staging

on:
  push:
    branches: [develop]
    paths:
      - "pps-education-backend/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "image=ghcr.io/${{ github.repository }}/backend:staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./pps-education-backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository }}/backend:staging-latest

