# Deploy tự động lên môi trường Staging (server vật lý tự host, xem
# deploy/README.md) khi push vào `main` — `main` là nhánh auto-deploy staging
# (đổi từ `develop` trước đây, xem CONTRIBUTING.md mục 1 — cập nhật 2026-08-26).
# Cần thiết lập trước GitHub Environment "staging" với secret:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_SSH_PORT — thông tin SSH
#   vào server, KHÔNG phải secret nghiệp vụ (DB/JWT/v.v. nằm trong .env trên
#   server, xem deploy/README.md).
name: CD - Staging

on:
  push:
    branches: [main]
    paths:
      - "pps-education-backend/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "image=ghcr.io/${{ github.repository }}/backend:staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./pps-education-backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository }}/backend:staging-latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy backend over SSH (pull staging-latest + restart container)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script: |
            cd /opt/pps-education/staging
            docker compose pull backend
            docker compose up -d --no-deps backend
            docker image prune -f
