# Deploy 2 SPA frontend (admin, user) lên server vật lý tự host (xem
# deploy/README.md) khi push vào `main` (staging) hoặc `production`
# (production) — build tĩnh (Vite) + rsync dist/ sang đúng thư mục Nginx serve
# trên server, không cần restart gì (file tĩnh).
#
# apiClient.ts của cả 2 app gọi API qua đường dẫn tương đối "/api" (same-
# origin) — Nginx trên server proxy /api/ sang backend cùng stack, nên
# KHÔNG cần cấu hình base URL API riêng ở đây.
#
# Cần GitHub Environment "staging"/"production" với secret SSH dùng chung
# backend (DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY/DEPLOY_SSH_PORT) + biến
# VITE_* riêng theo stack (Google OAuth Client ID, Firebase Web config).
name: CD - Frontend

on:
  push:
    branches: [main, production]
    paths:
      - "pps-education-frontend/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, user]
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pps-education-frontend/${{ matrix.app }}/package-lock.json

      - name: Install deps
        working-directory: pps-education-frontend/${{ matrix.app }}
        run: npm ci

      - name: Build
        working-directory: pps-education-frontend/${{ matrix.app }}
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build

      - name: Deploy dist/ over rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: pps-education-frontend/${{ matrix.app }}/dist/
          remote_path: /opt/pps-education/${{ github.ref_name == 'production' && 'production' || 'staging' }}/frontend/${{ matrix.app }}/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_port: ${{ secrets.DEPLOY_SSH_PORT }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
