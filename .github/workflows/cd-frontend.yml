# Deploy 2 SPA frontend (admin, user) lên server vật lý tự host (xem
# deploy/README.md) khi push vào `main` (staging) hoặc `production`
# (production) — build tĩnh (Vite) rồi copy dist/ sang đúng thư mục Nginx
# serve trên server, không cần restart gì (file tĩnh).
#
# apiClient.ts của cả 2 app gọi API qua đường dẫn tương đối "/api" (same-
# origin) — Nginx trên server proxy /api/ sang backend cùng stack, nên
# KHÔNG cần cấu hình base URL API riêng ở đây.
#
# LƯU Ý (2026-08-27): job chạy TRỰC TIẾP trên SELF-HOSTED RUNNER cài ngay
# trên server vật lý (không phải ubuntu-latest) — build + copy dist/ luôn
# tại chỗ, KHÔNG cần rsync qua SSH nữa (lý do: server không có static IP
# public, GitHub Actions cloud không SSH/rsync vào IP LAN được — xem comment
# chi tiết ở cd-staging.yml). Cần GitHub Environment "staging"/"production"
# với biến VITE_* riêng theo stack (Google OAuth Client ID, Firebase Web
# config) — không còn cần DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY/DEPLOY_SSH_PORT.
name: CD - Frontend

on:
  push:
    branches: [main, production]
    paths:
      - "pps-education-frontend/**"
  workflow_dispatch: {} # cho phép bấm "Run workflow" tay trên GitHub, chọn branch main/production để deploy đúng stack

jobs:
  build-and-deploy:
    runs-on: [self-hosted, pps-education]
    strategy:
      matrix:
        app: [admin, user]
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pps-education-frontend/${{ matrix.app }}/package-lock.json

      - name: Install deps
        working-directory: pps-education-frontend/${{ matrix.app }}
        run: npm ci

      - name: Build
        working-directory: pps-education-frontend/${{ matrix.app }}
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build

      - name: Copy dist/ vào thư mục Nginx serve (xóa bản cũ trước, giữ nguyên hành vi --delete của rsync trước đây)
        run: |
          TARGET="/opt/pps-education/${{ github.ref_name == 'production' && 'production' || 'staging' }}/frontend/${{ matrix.app }}"
          rm -rf "$TARGET"/*
          mkdir -p "$TARGET"
          cp -r pps-education-frontend/${{ matrix.app }}/dist/. "$TARGET"/
