<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPS Education — Admin</title>

    <!-- Chẩn đoán tạm (xem CLAUDE.md task trắng trang trên Safari/iOS 16.1) — bắt lỗi JS
         không có error boundary nào bắt được và in thẳng lên trang thay vì màn hình trắng
         im lặng. Chạy TRƯỚC script module chính nên bắt được cả lỗi lúc React mount. Gỡ bỏ
         sau khi đã xác định được nguyên nhân thật. -->
    <script>
      function ppsShowDiagError(label, err) {
        var msg = (err && (err.stack || err.message)) || String(err);
        var el = document.createElement("pre");
        el.style.cssText = "white-space:pre-wrap;padding:16px;font-size:14px;line-height:1.4;color:#000;background:#fff;position:fixed;inset:0;z-index:999999;overflow:auto;margin:0;";
        el.textContent = label + ":\n" + msg;
        document.body.appendChild(el);
      }
      window.addEventListener("error", function (e) {
        ppsShowDiagError("LỖI JS", e.error || e.message);
      });
      window.addEventListener("unhandledrejection", function (e) {
        ppsShowDiagError("LỖI PROMISE", e.reason);
      });
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA/"Thêm vào Màn hình chính" — bắt buộc trên iOS để Web Push hoạt động
         (Apple chỉ cho phép Web Push khi chạy standalone, xem pushNotifications.ts).
         icon-192.png/icon-512.png/apple-touch-icon.png: logo PPS (không kèm chữ
         "PPS VIETNAM") hiển thị trên màn hình chính khi tạo shortcut. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PPS Admin" />
    <meta name="theme-color" content="#0e8c86" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
