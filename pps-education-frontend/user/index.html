         Push khi chạy standalone qua "Thêm vào Màn hình chính" — xem pushNotifications.ts,
         PWA Phase 1 đã che luôn phần này nên push không cần thêm gì ở index.html). -->

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PPS Portal" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
