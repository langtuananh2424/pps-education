# Môi trường phát triển cục bộ (NFR-TECH-06) — đảm bảo đồng nhất giữa các thành viên trong nhóm.
# Chạy: docker compose up -d --build
# Frontend (React) sẽ được thêm vào file này khi bắt đầu Frontend Phase 1.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pps-education-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pps_education
      POSTGRES_USER: pps_app
      POSTGRES_PASSWORD: root123456
    ports:
      - "5432:5432"
    volumes:
      - pps_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pps_app -d pps_education"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./pps-education-backend
      dockerfile: Dockerfile
    container_name: pps-education-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # JDK image (eclipse-temurin) đọc biến TZ chuẩn để set múi giờ mặc định JVM lúc khởi động -
      # thiếu biến này JVM chạy theo UTC (giờ mặc định của base image), lệch 7 tiếng so với giờ VN
      # mà admin nhập cho shifts.check_in_time/class_sessions.start_time (LocalTime, không kèm
      # timezone) -- phát hiện qua UC-09: OffsetDateTime.now().toLocalTime() (server) so sánh với
      # giờ ca/lịch dạy (VN) sai lệch múi giờ, mọi chấm công đúng giờ thực tế bị từ chối nhầm thành
      # "ngoài cửa sổ chấm công". Xem comment liên quan ở application.yml (hibernate.jdbc.time_zone).
      TZ: Asia/Ho_Chi_Minh
      DB_URL: jdbc:postgresql://postgres:5432/pps_education
      DB_USERNAME: pps_app
      DB_PASSWORD: root123456
      JWT_SECRET: local_dev_secret_change_in_prod_min_256_bits_xxxxxxxxxxxxxxxxx
      SEED_DEV_USERS: "true" # tạo sẵn 11 tài khoản demo (1/role) - xem DevUserSeeder
      GOOGLE_OAUTH_CLIENT_IDS: "295752787966-8dsm6jo0p8md2p60safqqmifeo293855.apps.googleusercontent.com" # Client ID không phải secret (public, dùng ở FE) — audience verify id_token (UC-01 A4)
      # Cloudflare R2 (UC-40 Question.audioUrl/imageUrl) - secret thật, KHÔNG hardcode ở đây.
      # Đọc từ file .env ở root (Compose tự nạp, đã gitignore) - xem .env.example.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?Thiếu R2_ACCOUNT_ID - copy .env.example thành .env ở root và điền giá trị thật}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Thiếu R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Thiếu R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?Thiếu R2_BUCKET_NAME}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:?Thiếu R2_PUBLIC_BASE_URL}
      # Override endpoint đầy đủ khi tự host MinIO thay R2 thật (server production tự host,
      # xem deploy/README.md) - để trống thì giữ hành vi R2 thật như cũ.
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      # SMTP (UC-15, cảnh báo thiếu BTVN...) - tùy chọn, để trống vẫn chạy được
      # (application.yml default rỗng, EmailNotificationSender tự chuyển FAILED).
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_CONTACT_HOTLINE: ${MAIL_CONTACT_HOTLINE:-}
      MAIL_CONTACT_SUPPORT_EMAIL: ${MAIL_CONTACT_SUPPORT_EMAIL:-}
      MAIL_CONTACT_WEBSITE: ${MAIL_CONTACT_WEBSITE:-}
      # Firebase Admin SDK (kenh PUSH, xem FirebaseConfig.java) - tuy chon, de trong
      # van chay duoc (PushNotificationSender tu bao loi co kiem soat).
      FIREBASE_CREDENTIALS_BASE64: ${FIREBASE_CREDENTIALS_BASE64:-}
      # SPIKE/TEST rieng "AI cham Speaking" (2026-08-22, xem SpeakingAiGradingTestService) - tuy
      # chon, de trong van chay duoc (endpoint tra loi 400 co kiem soat khi goi ma chua cau hinh).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # SPIKE (nhánh spike/openrouter-ai-rotation, 2026-08-25) - 9Router (https://github.com/decolua/
      # 9router), proxy AI chạy TRÊN MÁY HOST (npm install -g 9router && 9router, ngoài container này) -
      # dùng host.docker.internal (Docker Desktop tự map sẵn) để container gọi ra được máy host, vì
      # "localhost" bên TRONG container KHÔNG trỏ tới máy host (khác khi chạy backend qua mvn
      # spring-boot:run trực tiếp trên host, lúc đó localhost mới đúng là 9Router).
      NINE_ROUTER_BASE_URL: ${NINE_ROUTER_BASE_URL:-http://host.docker.internal:20128/v1}
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
      NINE_ROUTER_MODEL: ${NINE_ROUTER_MODEL:-}
      NINE_ROUTER_STT_MODEL: ${NINE_ROUTER_STT_MODEL:-groq/whisper-large-v3-turbo}
      NINE_ROUTER_AUDIO_MODEL: ${NINE_ROUTER_AUDIO_MODEL:-ag/gemini-3.5-flash-low}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pps-education-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pps-education.dev
      PGADMIN_DEFAULT_PASSWORD: changeme
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles: ["tools"] # chỉ chạy khi: docker compose --profile tools up

volumes:
  pps_pg_data:
