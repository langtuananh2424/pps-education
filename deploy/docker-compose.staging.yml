# Stack STAGING trên server vật lý tự host — copy file này thành
# /opt/pps-education/staging/docker-compose.yml trên server (xem
# deploy/README.md cho quy trình bootstrap đầy đủ). Secret thật nằm trong
# /opt/pps-education/staging/.env (KHÔNG commit, KHÔNG đi qua CI) — file này
# chỉ chứa placeholder tham chiếu.
#
# Ghi chú: server chạy Docker Engine trên Linux (không phải Docker Desktop),
# nên "host.docker.internal" cần khai báo thủ công qua extra_hosts bên dưới
# để backend gọi được 9Router chạy trên host (xem deploy/README.md mục 9Router).
#
# QUAN TRỌNG (sự cố 2026-09-04): extra_hosts KHÔNG dùng giá trị đặc biệt
# "host-gateway" của Docker - giá trị đó resolve ra gateway của bridge MẶC
# ĐỊNH (docker0, thường 172.17.0.1), không phải gateway của network "internal"
# tuỳ chỉnh bên dưới mà backend thực sự nằm trong -> container không có route
# tới đó, request tới 9Router bị treo tới khi timeout. Phải trỏ thẳng vào
# gateway thật của network "internal", nên subnet network này được ghim cố
# định (xem networks.internal.ipam bên dưới) để gateway không đổi giữa các
# lần "docker compose down/up".

name: pps-staging

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: pps_education
      POSTGRES_USER: pps_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432" # chỉ localhost - truy cập từ máy cá nhân qua SSH tunnel (xem deploy/README.md)
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pps_app -d pps_education"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9002:9000" # public GET qua Nginx (files-staging.ppsvietnam.edu.vn) - xem deploy/nginx
    networks: [internal]

  # Khoi tao MinIO 1 lan: tao bucket + bat quyen doc an danh (anonymous
  # download) cho URL public {R2_PUBLIC_BASE_URL}/{key}. Truoc day la thao tac
  # tay trong deploy/README.md -> hay bi quen, gay loi 403 khi serve file
  # (bucket khong ton tai / thieu policy). Chay lai moi lan `docker compose
  # up`, idempotent (--ignore-existing + set lai policy). Backend cho service
  # nay xong moi khoi dong (xem depends_on ben duoi).
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set mio http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null 2>&1; do
          echo 'minio-init: cho minio san sang...'; sleep 2;
        done
        mc mb --ignore-existing mio/pps-media
        mc anonymous set download mio/pps-media
        mc anonymous get mio/pps-media
        echo 'minio-init: bucket pps-media da san sang (anonymous download)'
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    networks: [internal]
    restart: "no"

  backend:
    image: ghcr.io/langtuananh2424/pps-education/backend:staging-latest
    restart: unless-stopped
    extra_hosts:
      # Trỏ thẳng vào gateway cố định của network "internal" (172.28.0.0/24,
      # xem networks.internal.ipam) - KHÔNG dùng "host-gateway" (xem ghi chú
      # đầu file, sự cố 2026-09-04).
      - "host.docker.internal:172.28.0.1"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: staging
      DB_URL: jdbc:postgresql://postgres:5432/pps_education
      DB_USERNAME: pps_app
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SEED_DEV_USERS: ${SEED_DEV_USERS:-false}
      # Bootstrap 1 tài khoản sysadmin lần đầu (KHÁC SEED_DEV_USERS - xem InitialAdminSeeder.java).
      # Mặc định tắt - chỉ bật 1 lần khi cần tạo sysadmin đầu tiên, rồi tắt lại (đặt false trong .env).
      SEED_INITIAL_ADMIN: ${SEED_INITIAL_ADMIN:-false}
      SEED_SYSADMIN_PASSWORD: ${SEED_SYSADMIN_PASSWORD:-}
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS}
      # MinIO tự host thay Cloudflare R2 thật (xem R2StorageConfig.java) -
      # R2_ENDPOINT_URL trỏ vào service minio trong network nội bộ (KHÔNG
      # phải 127.0.0.1 - đó là cổng Nginx dùng để proxy GET công khai).
      R2_ENDPOINT_URL: http://minio:9000
      R2_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      R2_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      R2_BUCKET_NAME: pps-media
      R2_PUBLIC_BASE_URL: https://files-staging.ppsvietnam.edu.vn
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_CONTACT_HOTLINE: ${MAIL_CONTACT_HOTLINE:-}
      MAIL_CONTACT_SUPPORT_EMAIL: ${MAIL_CONTACT_SUPPORT_EMAIL:-}
      MAIL_CONTACT_WEBSITE: ${MAIL_CONTACT_WEBSITE:-}
      FIREBASE_CREDENTIALS_BASE64: ${FIREBASE_CREDENTIALS_BASE64:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NINE_ROUTER_BASE_URL: ${NINE_ROUTER_BASE_URL:-http://host.docker.internal:20128/v1}
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
      NINE_ROUTER_MODEL: ${NINE_ROUTER_MODEL:-}
      NINE_ROUTER_STT_MODEL: ${NINE_ROUTER_STT_MODEL:-groq/whisper-large-v3-turbo}
      NINE_ROUTER_AUDIO_MODEL: ${NINE_ROUTER_AUDIO_MODEL:-ag/gemini-3.5-flash-low}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [internal]

networks:
  internal:
    driver: bridge
    ipam:
      config:
        # Ghim cố định (không để Docker tự chọn) - subnet auto-assign có thể
        # đổi giữa các lần "down/up", làm sai gateway mà extra_hosts.backend
        # đang trỏ tới thẳng (172.28.0.1). Khác với production
        # (172.29.0.0/24) dù 2 stack chạy chung 1 server vật lý.
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  pg_data:
  minio_data:
