# Rà soát bảo mật 2026-09-28 (đã xác nhận với người dùng) — cấu hình mức http
# dùng chung cho mọi server block PPS (admin/student/files, cả staging lẫn
# production). Cài 1 lần:
#   sudo cp deploy/nginx/pps-security.conf /etc/nginx/conf.d/pps-security.conf
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/nginx/pps-security-headers.conf /etc/nginx/snippets/
#   sudo nginx -t && sudo systemctl reload nginx
# (xem deploy/README.md mục "Nginx - rate limit và header bảo mật").

# IP thật của người dùng. Mọi request đi qua Cloudflare Tunnel nên
# $remote_addr luôn là 127.0.0.1 (cloudflared) — Cloudflare gửi IP gốc trong
# CF-Connecting-IP. Không có header này (gọi thẳng vào máy chủ, không qua
# Cloudflare) thì dùng $remote_addr.
map $http_cf_connecting_ip $pps_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Ngưỡng đặt rộng tay vì cả lớp học/văn phòng có thể dùng chung 1 IP công cộng.
# Đăng nhập: chặn dò mật khẩu/khoá tài khoản hàng loạt (backend còn chặn thêm
# theo số lần SAI, xem LoginIpThrottle.java).
limit_req_zone $pps_client_ip zone=pps_auth:10m rate=60r/m;
# Upload file (≤200MB/lần): chặn làm đầy ổ đĩa MinIO.
limit_req_zone $pps_client_ip zone=pps_upload:10m rate=30r/m;
# API chung (gồm cả nộp bài chấm AI - tốn chi phí).
limit_req_zone $pps_client_ip zone=pps_api:20m rate=50r/s;
# Domain file (ảnh/audio/video).
limit_req_zone $pps_client_ip zone=pps_files:20m rate=100r/s;

# File HTML/SVG/XML mở trực tiếp trên domain file không được chạy script
# (sandbox) — chặn dùng domain của trung tâm để host trang lừa đảo/XSS. Dùng
# trong files.conf.template.
map $upstream_http_content_type $pps_files_csp {
    default          "";
    ~*^text/html     "sandbox; default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'";
    ~*^image/svg     "sandbox; default-src 'none'; style-src 'unsafe-inline'";
    ~*xml            "sandbox; default-src 'none'";
}
