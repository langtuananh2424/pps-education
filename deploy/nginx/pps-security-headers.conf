# Rà soát bảo mật 2026-09-28 (đã xác nhận với người dùng) — header bảo mật cho
# app admin/student. Cài vào /etc/nginx/snippets/ (xem pps-security.conf).
# LƯU Ý nginx: location nào tự có add_header thì KHÔNG kế thừa add_header của
# server -> phải include lại file này trong location đó.
#
# CSP tập trung chặn script lạ (XSS - token đăng nhập đang lưu localStorage):
# chỉ cho script của chính app + Google Sign-In + YouTube IFrame API + Firebase
# (importScripts trong firebase-messaging-sw.js). Ảnh/audio/video/font/iframe
# chưa giới hạn domain để không vỡ nội dung giảng dạy nhúng từ nguồn ngoài.
add_header Content-Security-Policy "script-src 'self' https://accounts.google.com https://www.youtube.com https://s.ytimg.com https://www.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
