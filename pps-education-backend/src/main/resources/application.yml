spring:
  application:
    name: pps-education-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pps_education}
    username: ${DB_USERNAME:pps_app}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway là nguồn chân lý cho schema (NFR-TECH-04) - Hibernate không tự sinh DDL
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# spring.security.oauth2.client.registration.google: thêm lại khi implement nhánh
# Google OAuth (UC-01 Main Flow bước 4/A4, xem README "Việc còn lại của Sprint 1").
# Khai báo với client-id/secret rỗng khiến Spring Boot OAuth2ClientAutoConfiguration
# validate fail cứng lúc khởi động ở mọi môi trường chưa có Google credentials thật.

server:
  port: ${SERVER_PORT:8080}

# NFR-AUT / FR-AUT-01, FR-AUT-02
app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_SECRET_IN_ENV_MIN_256_BITS_xxxxxxxxxxxxxxxxxxxx}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 14
  security:
    brute-force:
      max-failed-attempts: 5
      lock-duration-minutes: 15

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    vn.com.pps.education: INFO
    org.hibernate.SQL: WARN
---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    vn.com.pps.education: DEBUG
    org.hibernate.SQL: DEBUG
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    vn.com.pps.education: INFO
