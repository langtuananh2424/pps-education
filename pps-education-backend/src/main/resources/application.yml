spring:
  application:
    name: pps-education-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # Default khớp docker-compose.yml (postgres.environment.POSTGRES_PASSWORD)
    # để `docker compose up -d postgres` + `mvn spring-boot:run` chạy được ngay
    # không cần set biến môi trường thủ công. Đổi qua DB_PASSWORD env var ở
    # môi trường thật (staging/prod), không sửa default này thành secret thật.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pps_education}
    username: ${DB_USERNAME:pps_app}
    password: ${DB_PASSWORD:dev_only_not_a_real_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway là nguồn chân lý cho schema (NFR-TECH-04) - Hibernate không tự sinh DDL
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        # ĐÃ BỎ hibernate.jdbc.time_zone=UTC (xác nhận với người dùng
        # 2026-08-20 — dữ liệu còn ở local/staging, chưa lên production,
        # chấp nhận migrate 1 lần). Setting cũ ép Hibernate bind LocalTime
        # qua java.sql.Time kiểu cũ, gây lệch ĐÚNG 8 TIẾNG khi ghi xuống DB
        # (java.sql.Time.valueOf() dùng offset LỊCH SỬ NĂM 1970 của múi giờ
        # Asia/Ho_Chi_Minh — khi đó UTC+8, mãi 1975 mới đổi UTC+7) — vi phạm
        # CHECK chk_session_time với mọi buổi/tiết bắt đầu trước ~08:00
        # (nghiệp vụ bắt buộc: Tiết 1 = 07:00-07:30 tuỳ trường). Đã chạy
        # V129 (bake in giá trị đúng đang hiển thị thành giá trị raw mới
        # cho 5 bảng: class_sessions, session_periods, site_period_templates,
        # shifts, leave_requests) TRONG CÙNG 1 LẦN DEPLOY với việc bỏ
        # setting này — bắt buộc đi cùng nhau, không tách rời (Flyway chạy
        # trước khi Hibernate khởi tạo nên an toàn khi cùng 1 lần khởi động).

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Nâng giới hạn mặc định của Spring Boot (1MB/10MB) để chấp nhận upload
  # audio/video thật (tối đa 200MB cho video CURRICULUM_DOCUMENT/
  # REVIEW_VIDEO - bổ sung 2026-07-22, xem app.media bên dưới và
  # MediaStorageService.MAX_VIDEO_BYTES). max-request-size cao hơn
  # max-file-size một chút để chừa chỗ cho phần multipart metadata khác.
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 205MB

  # Kênh EMAIL của module Notification - chưa cấu hình SMTP thật (host rỗng)
  # thì EmailNotificationSender gửi lỗi có kiểm soát, delivery chuyển FAILED
  # + lên lịch retry (đúng state machine đã thiết kế trong SDD), không crash
  # app. Set MAIL_HOST/MAIL_USERNAME/MAIL_PASSWORD qua .env khi có SMTP thật.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000

# UC-01 Main Flow bước 4/A4 (đăng nhập Google) dùng flow xác thực id_token
# (Frontend tự làm Google Sign-In, gửi id_token lên backend verify qua JWKS
# - xem app.security.google bên dưới), KHÔNG dùng
# spring.security.oauth2.client.registration.google (đó là flow
# authorization-code/redirect phía server, không khớp UC-01). Cố tình
# không khai báo block này - đừng "thêm lại" nhầm, sẽ làm
# OAuth2ClientAutoConfiguration validate fail cứng lúc khởi động khi chưa
# có client-secret thật.

server:
  port: ${SERVER_PORT:8080}

# Health check cho Docker/Railway (NFR-TECH-06) - chỉ expose "health", không lộ
# /actuator/env, /actuator/beans... ra ngoài (NFR-SEC-03)
management:
  endpoints:
    web:
      exposure:
        include: health

# NFR-AUT / FR-AUT-01, FR-AUT-02
app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_SECRET_IN_ENV_MIN_256_BITS_xxxxxxxxxxxxxxxxxxxx}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 14
  security:
    brute-force:
      max-failed-attempts: 5
      lock-duration-minutes: 15
    google:
      # CSV client-id (Web/Mobile) dùng làm audience khi verify id_token (UC-01 A4).
      client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs
  mail:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@pps.edu.vn}
    # Hiển thị trong footer chuẩn của email (NotificationEmailTemplateService) - chưa có
    # giá trị thật từ PM, để trống thì footer giữ nguyên placeholder dạng "[Hotline PPS]"
    # thay vì tự bịa số/email/website.
    hotline: ${MAIL_CONTACT_HOTLINE:}
    support-email: ${MAIL_CONTACT_SUPPORT_EMAIL:}
    website: ${MAIL_CONTACT_WEBSITE:}
  notification:
    # Ngưỡng retry cho kênh gửi ngoài (EMAIL...) - SDD không quy định số cụ
    # thể, mặc định hợp lý có thể chỉnh qua env var khi cần.
    max-retry-count: ${NOTIFICATION_MAX_RETRY:3}
    retry-interval-minutes: ${NOTIFICATION_RETRY_INTERVAL_MINUTES:5}
    # Kênh PUSH (FCM) - bổ sung ngoài SDD gốc, đã xác nhận với người dùng
    # (2026-08-08). Chưa cấu hình (biến rỗng, mặc định máy dev/CI) thì
    # FirebaseConfig trả bean null có kiểm soát, PushNotificationSender báo
    # lỗi + job tự retry, không crash app. Set FIREBASE_CREDENTIALS_BASE64
    # (base64 của service-account JSON tải từ Firebase Console) khi có
    # project Firebase thật.
    firebase:
      credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
    # Kênh SMS (Twilio) - dành riêng cho Phụ huynh/Học sinh, bổ sung ngoài
    # SDD gốc, đã xác nhận với người dùng (2026-08-08). Chưa cấu hình thì
    # SmsNotificationSender báo lỗi có kiểm soát + job tự retry.
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
  finance:
    # UC-30 Main Flow bước 5-6: webhook /api/webhooks/bank-payment không
    # xác thực qua JWT (permitAll, SecurityConfig) vì gọi từ hệ thống ngân
    # hàng ngoài - SDD không đặc tả cơ chế xác thực, bổ sung shared-secret
    # tối thiểu (header X-Webhook-Secret) để không mở endpoint ghi dữ liệu
    # tài chính hoàn toàn công khai. Đổi sang secret thật khi tích hợp
    # ngân hàng thật.
    bank-webhook-secret: ${BANK_WEBHOOK_SECRET:CHANGE_THIS_SECRET_IN_ENV}
  seed:
    # DevUserSeeder - tạo 11 tài khoản demo (1/role) lúc khởi động app. Mặc định
    # false: KHÔNG gắn theo Spring profile "dev" vì Testcontainers cũng chạy
    # context ở profile mặc định "dev" (xem AbstractIntegrationTest, không có
    # @ActiveProfiles) - gắn theo profile sẽ lọt seed data vào DB test. Chỉ bật
    # qua env var SEED_DEV_USERS=true (docker-compose.yml/.env.example local dev
    # đã bật sẵn) để test/CI/staging/production không bao giờ dính.
    dev-users: ${SEED_DEV_USERS:false}
  media:
    # Bổ sung ngoài SDD gốc, đã xác nhận với người dùng (2026-07-21, cập nhật
    # 2026-07-22): API upload file audio/ảnh cho Question.audioUrl/imageUrl
    # (UC-40) - trước đây backend không có hạ tầng lưu file (xem ghi chú "Tệp
    # coi như đã upload lên CDN từ trước" ở ReviewVideoService/các URL field khác -
    # vẫn giữ nguyên, phạm vi lần này CHỈ áp dụng cho Question). Lưu trên
    # Cloudflare R2 (Object Storage tương thích S3 API, không tính phí egress)
    # - thay thế quyết định lưu đĩa cục bộ + Docker volume trước đó. Placeholder
    # non-blank mặc định (không phải secret thật, giống JWT_SECRET/
    # BANK_WEBHOOK_SECRET) - AwsBasicCredentials.create() ném lỗi ngay lúc khởi
    # động nếu access-key rỗng, làm sập toàn bộ Spring context dùng chung cho
    # MỌI test (không chỉ Media*) khi CI/máy dev chưa cấu hình R2 thật. Chỉ cần
    # override qua env var khi thật sự gọi API upload.
    r2:
      account-id: ${R2_ACCOUNT_ID:CHANGE_THIS_IN_ENV}
      access-key: ${R2_ACCESS_KEY_ID:CHANGE_THIS_IN_ENV}
      secret-key: ${R2_SECRET_ACCESS_KEY:CHANGE_THIS_IN_ENV}
      bucket: ${R2_BUCKET_NAME:CHANGE_THIS_IN_ENV}
      public-base-url: ${R2_PUBLIC_BASE_URL:https://change-this-in-env.r2.dev}
  ai-grading-test:
    # SPIKE/TEST riêng (2026-08-22, đã xác nhận với người dùng) - đánh giá khả thi kỹ thuật/chi phí
    # hướng "AI chấm Speaking" (Video phản xạ V2, xem SpeakingAiGradingTestService) - KHÔNG phải cấu
    # hình của 1 UC chính thức. Để trống thì endpoint trả lỗi có kiểm soát khi gọi (không crash lúc
    # khởi động, giống mẫu MAIL_HOST/FIREBASE_CREDENTIALS_BASE64).
    openai-api-key: ${OPENAI_API_KEY:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    # Bổ sung 2026-08-22 - dùng thay Claude khi chưa cấu hình ANTHROPIC_API_KEY (Anthropic yêu cầu
    # nạp tiền trước) - Gemini free tier không cần thẻ thanh toán, xem SpeakingAiGradingTestService.
    gemini-api-key: ${GEMINI_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    vn.com.pps.education: INFO
    org.hibernate.SQL: WARN
---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    vn.com.pps.education: DEBUG
    org.hibernate.SQL: DEBUG
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    vn.com.pps.education: INFO
