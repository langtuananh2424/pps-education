spring:
  application:
    name: pps-education-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # Default khớp docker-compose.yml (postgres.environment.POSTGRES_PASSWORD)
    # để `docker compose up -d postgres` + `mvn spring-boot:run` chạy được ngay
    # không cần set biến môi trường thủ công. Đổi qua DB_PASSWORD env var ở
    # môi trường thật (staging/prod), không sửa default này thành secret thật.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pps_education}
    username: ${DB_USERNAME:pps_app}
    password: ${DB_PASSWORD:root123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway là nguồn chân lý cho schema (NFR-TECH-04) - Hibernate không tự sinh DDL
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        # JVM chạy ở múi giờ +07:00 (Việt Nam) - nếu không cố định UTC ở đây,
        # driver Postgres có thể throw DateTimeException khi đọc cột TIME gần
        # nửa đêm (quy đổi qua epoch nội bộ bị âm) - phát hiện qua UC-09
        # (shifts.check_in_time). Không đổi user.timezone của cả JVM để tránh
        # ảnh hưởng OffsetDateTime.now() dùng nơi khác trong app.
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# UC-01 Main Flow bước 4/A4 (đăng nhập Google) dùng flow xác thực id_token
# (Frontend tự làm Google Sign-In, gửi id_token lên backend verify qua JWKS
# - xem app.security.google bên dưới), KHÔNG dùng
# spring.security.oauth2.client.registration.google (đó là flow
# authorization-code/redirect phía server, không khớp UC-01). Cố tình
# không khai báo block này - đừng "thêm lại" nhầm, sẽ làm
# OAuth2ClientAutoConfiguration validate fail cứng lúc khởi động khi chưa
# có client-secret thật.

server:
  port: ${SERVER_PORT:8080}

# Health check cho Docker/Railway (NFR-TECH-06) - chỉ expose "health", không lộ
# /actuator/env, /actuator/beans... ra ngoài (NFR-SEC-03)
management:
  endpoints:
    web:
      exposure:
        include: health

# NFR-AUT / FR-AUT-01, FR-AUT-02
app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_SECRET_IN_ENV_MIN_256_BITS_xxxxxxxxxxxxxxxxxxxx}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 14
  security:
    brute-force:
      max-failed-attempts: 5
      lock-duration-minutes: 15
    google:
      # CSV client-id (Web/Mobile) dùng làm audience khi verify id_token (UC-01 A4).
      client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    vn.com.pps.education: INFO
    org.hibernate.SQL: WARN
---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    vn.com.pps.education: DEBUG
    org.hibernate.SQL: DEBUG
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    vn.com.pps.education: INFO
